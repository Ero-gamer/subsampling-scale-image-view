name: detekt (manual)

# detekt has no safe auto-fix for its own rules, so "report" only reports. "update-baseline"
# records ALL current findings in config/detekt/baseline.xml and opens a PR: that silences them,
# it does not fix them, so review the diff before merging.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [report, update-baseline]
        default: report

permissions:
  contents: write
  pull-requests: write

env:
  DETEKT_VERSION: "1.23.8"

jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install detekt CLI
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -fsSL -o detekt.zip "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip"
          unzip -q detekt.zip
          echo "$RUNNER_TEMP/tools/detekt-cli-${DETEKT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Update baseline
        if: ${{ inputs.mode == 'update-baseline' }}
        run: >
          detekt-cli --config config/detekt/detekt.yml --build-upon-default-config
          --baseline config/detekt/baseline.xml --create-baseline --input library/src/main/java

      - name: detekt
        if: ${{ inputs.mode != 'update-baseline' }}
        run: >
          detekt-cli --config config/detekt/detekt.yml --build-upon-default-config
          --baseline config/detekt/baseline.xml --input library/src/main/java

      - name: Open pull request with the fixes
        if: ${{ inputs.mode == 'update-baseline' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Nothing to fix."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="ci/detekt-baseline-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -A
          git commit -m "style: update detekt baseline"
          git push origin "$branch"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "style: update detekt baseline" \
            --body "Automated, manually triggered. Layout-only changes verified by scripts/verify-safe-format.py and a compile check. Review the diff before merging." \
            || echo "Could not open a PR automatically; branch '$branch' was pushed."
